<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>💕 هنا ويوسف — حكايتنا الجميلة</title>
  <link rel="icon" href="/assets/logo.png"/>
  <link rel="apple-touch-icon" href="/assets/logo.png"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#ff6b9d"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="هنا ويوسف"/>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/love.css"/>
</head>
<body>

<!-- Floating petals/hearts -->
<div id="heartsContainer" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:0;"></div>

<div class="login-page-bg" style="position:relative;z-index:1;">

  <div class="logo-circle" onclick="logoClick()">
    <img src="/assets/logo.png" alt="هنا ويوسف"/>
  </div>
  <div class="site-title">hana-youssef.website</div>

  <div class="main-title">هنا… حيث تبدأ أجمل حكاياتنا 💖</div>
  <div class="sub-title">كل لحظة بيننا تستحق أن تُحفظ</div>

  <div class="day-counter-mini" id="miniCounter">جاري الحساب...</div>

  <form class="login-card" id="loginForm" aria-label="تسجيل الدخول إلى ذكرياتنا">
    <div class="card-title">ادخلي إلى ذكرياتنا</div>
    <div class="card-hint">كلمة صغيرة تفتح لكِ عالمًا من اللحظات الجميلة</div>
    <input type="text" name="username" value="hana" autocomplete="username" hidden/>

    <div class="input-wrap" style="position:relative;">
      <input type="password" id="passwordInput" name="password" placeholder="اكتبي كلمة المرور هنا..." autocomplete="current-password" required autofocus style="padding-left:50px;"/>
      <button type="button" onclick="togglePw()" id="eyeBtn" style="position:absolute;left:16px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:22px;line-height:1;color:#d4789c;" title="أظهر/اخفِ">🙈</button>
    </div>

    <div class="hint-text">
      تلميح: <span>تاريخ له مكان خاص في حكايتنا</span>
    </div>

    <button class="login-btn" type="submit">افتحي ألبومنا 💕</button>
    <div class="error-msg" id="errorMsg"></div>
  </form>

  <div class="domain-badge">hana-youssef.website • لحظاتنا، كما نحبها</div>
</div>

<style>
.heart-petal {
  position: absolute;
  bottom: -40px;
  animation: floatUp linear infinite;
  opacity: 0;
  pointer-events: none;
}
</style>

<script>
// Floating soft hearts/petals — keep the page light on mobile devices.
const petals = ['🌸','💕','🌷','💗','🌺','✿','💖','🩷','🌹'];
function spawnPetal() {
  const container = document.getElementById('heartsContainer');
  if (container.children.length >= 8) return;
  const h = document.createElement('div');
  h.className = 'heart-petal';
  h.textContent = petals[Math.floor(Math.random() * petals.length)];
  const sz = 12 + Math.random() * 18;
  const dur = 8 + Math.random() * 10;
  h.style.cssText = `left:${Math.random()*100}%;font-size:${sz}px;animation-duration:${dur}s;animation-delay:${Math.random()*3}s`;
  container.appendChild(h);
  setTimeout(() => h.remove(), (dur + 3) * 1000);
}
setInterval(spawnPetal, 5000);

// Counter
const START = new Date('2025-11-23T00:00:00');
function updateCounter() {
  const diff = new Date() - START;
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  document.getElementById('miniCounter').textContent = `معاكِ ${d} يوم و${h} ساعة و${m} دقيقة و${s} ثانية`;
}
updateCounter(); setInterval(updateCounter, 1000);

// Secret "بحبك"
let typed = '';
document.addEventListener('keypress', e => {
  typed += e.key;
  if (typed.includes('بحبك')) { window.location.href = '/upload'; typed = ''; }
  if (typed.length > 20) typed = typed.slice(-20);
});

// Logo clicks
let logoClicks = 0;
function logoClick() {
  logoClicks++;
  if (logoClicks >= 5) { window.location.href = '/upload'; logoClicks = 0; }
}

// Show/hide password
function togglePw() {
  const inp = document.getElementById('passwordInput');
  const btn = document.getElementById('eyeBtn');
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙉'; }
  else { inp.type = 'password'; btn.textContent = '🙈'; }
}

// Login
document.getElementById('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  doLogin();
});

async function doLogin() {
  const raw  = document.getElementById('passwordInput').value;
  const isAdmin = raw.endsWith('بحبك');
  const pw   = isAdmin ? raw.slice(0, -4) : raw;   // strip بحبك before sending
  const btn  = document.querySelector('.login-btn');
  const err  = document.getElementById('errorMsg');
  btn.textContent = '💫 جاري الدخول...';
  btn.disabled = true;
  err.textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    const d = await r.json();
    if (d.success) {
      btn.textContent = isAdmin ? '🔑 تم فتح مساحة الرفع' : '💖 أهلًا بكِ في ذكرياتنا';
      setTimeout(() => window.location.href = isAdmin ? '/upload' : '/gallery', 700);
    } else {
      err.textContent = d.message;
      btn.textContent = 'افتحي ألبومنا 💕';
      btn.disabled = false;
      document.getElementById('passwordInput').value = '';
      document.getElementById('passwordInput').focus();
      document.querySelector('.login-card').style.animation = 'shake 0.4s ease';
      setTimeout(() => document.querySelector('.login-card').style.animation = '', 500);
    }
  } catch {
      err.textContent = 'تعذر فتح الألبوم الآن. جربي مرة أخرى.';
    btn.textContent = 'افتحي ألبومنا 💕';
    btn.disabled = false;
  }
}
// ── Birthday Surprise ────────────────────────────────────
const SPECIAL_DAYS = [
  { month: 8, day: 7, emoji: '🎂', title: 'يوم جميل وُلدت فيه أنتِ', sub: 'أتمنى لكِ عامًا يشبه قلبك: دافئًا، هادئًا، ومليئًا بالفرح.' },
  { month: 1, day: 1, emoji: '✨', title: 'عام جديد لنا', sub: 'أتمنى أن يحمل لنا أيامًا أكثر هدوءًا وذكريات أجمل.' },
];
(function checkSpecialDay() {
  const now   = new Date();
  const month = now.getMonth() + 1;
  const day   = now.getDate();
  const match = SPECIAL_DAYS.find(d => d.month === month && d.day === day);
  if (!match) return;

  // Confetti layer
  const cc = document.createElement('div');
  cc.className = 'bday-confetti';
  const confettiEmojis = ['🎉','💕','🌹','✨','🎊','🌸','💖','⭐','🎈'];
  for (let i = 0; i < 25; i++) {
    const s = document.createElement('span');
    s.textContent = confettiEmojis[i % confettiEmojis.length];
    const dur = 3 + Math.random() * 5;
    s.style.cssText = `left:${Math.random()*100}%;animation-duration:${dur}s;animation-delay:${Math.random()*4}s;font-size:${16+Math.random()*18}px;`;
    cc.appendChild(s);
  }
  document.body.appendChild(cc);

  // Main overlay
  const ov = document.createElement('div');
  ov.className = 'bday-overlay';
  ov.innerHTML = `
    <span class="bday-emoji">${match.emoji}</span>
    <div class="bday-title">${match.title}</div>
    <div class="bday-sub">${match.sub}</div>
    <div class="bday-hearts">💕 ❤️ 💕 ❤️ 💕</div>
    <button class="bday-close" onclick="this.closest('.bday-overlay').remove();document.querySelector('.bday-confetti').remove();">
      شكرًا لأنكِ هنا
    </button>
  `;
  document.body.appendChild(ov);
})();
</script>
</body>
</html>
