<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>💕 هنا ويوسف — حكايتنا الجميلة</title>
  <link rel="icon" href="/assets/logo.png"/>
  <link rel="apple-touch-icon" href="/assets/logo.png"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#ff6b9d"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="هنا ويوسف"/>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/love.css"/>
  <link rel="stylesheet" href="/css/reference.css"/>
</head>
<body class="reference-login">

<div id="heartsContainer" class="login-hearts" aria-hidden="true"></div>

<main class="login-shell">
  <section class="login-panel">
    <div class="login-brand" onclick="logoClick()">
      <div class="login-logo logo-circle">
        <img src="/assets/logo.png" alt="هنا ويوسف"/>
      </div>
      <div class="brand-ar">هنا <span>♥</span></div>
      <div class="brand-latin">H A N A</div>
      <div class="brand-signature text-[#170901]">Youssef <b>×</b> Hana</div>
    </div>

    <div class="login-quote text-[#120701]">كل الحكايات جميلة،<br/>لكن حكايتنا مختلفة.</div>
    <div class="day-counter-mini" id="miniCounter">جاري الحساب...</div>

    <form class="login-card" id="loginForm" aria-label="تسجيل الدخول إلى ذكرياتنا">
      <input type="text" name="username" value="hana" autocomplete="username" hidden/>
      <div class="reference-input input-wrap">
        <span class="input-lock" aria-hidden="true"></span>
        <input type="password" id="passwordInput" name="password" placeholder="أدخلي كلمة المرور..." autocomplete="current-password" required autofocus/>
        <button type="button" onclick="togglePw()" id="eyeBtn" title="أظهر/اخفِ كلمة المرور" aria-label="أظهر أو أخفِ كلمة المرور">◉</button>
      </div>
      <button class="login-btn reference-login-btn" type="submit">ادخلي هنا <span>→</span></button>
      <div class="error-msg" id="errorMsg"></div>
    </form>

    <div class="login-player">
      <img src="/assets/logo.png" alt="" />
      <div class="player-copy">
        <strong>Our Little World</strong>
        <span>Hana &amp; Youssef</span>
      </div>
      <button type="button" aria-label="الأغنية السابقة">‹</button>
      <button type="button" aria-label="تشغيل الأغنية">Ⅱ</button>
      <button type="button" aria-label="الأغنية التالية">›</button>
    </div>
    <div class="login-footer">Same People&nbsp; • &nbsp;Beautiful Memories&nbsp; • &nbsp;Always&nbsp; ♡</div>
  </section>
</main>

<style>
.heart-petal {
  position: absolute;
  bottom: -40px;
  animation: floatUp linear infinite;
  opacity: 0;
  pointer-events: none;
}
</style>

<script>
// Floating soft hearts/petals — keep the page light on mobile devices.
const petals = ['🌸','💕','🌷','💗','🌺','✿','💖','🩷','🌹'];
function spawnPetal() {
  const container = document.getElementById('heartsContainer');
  if (container.children.length >= 8) return;
  const h = document.createElement('div');
  h.className = 'heart-petal';
  h.textContent = petals[Math.floor(Math.random() * petals.length)];
  const sz = 12 + Math.random() * 18;
  const dur = 8 + Math.random() * 10;
  h.style.cssText = `left:${Math.random()*100}%;font-size:${sz}px;animation-duration:${dur}s;animation-delay:${Math.random()*3}s`;
  container.appendChild(h);
  setTimeout(() => h.remove(), (dur + 3) * 1000);
}
setInterval(spawnPetal, 5000);

// Counter
const START = new Date('2025-11-23T00:00:00');
function updateCounter() {
  const diff = new Date() - START;
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  const counter = document.getElementById('miniCounter');
  if (counter) counter.textContent = `معاكِ ${d} يوم و${h} ساعة و${m} دقيقة و${s} ثانية`;
}
updateCounter(); setInterval(updateCounter, 1000);

// Secret "بحبك"
let typed = '';
document.addEventListener('keypress', e => {
  typed += e.key;
  if (typed.includes('بحبك')) { window.location.href = '/upload'; typed = ''; }
  if (typed.length > 20) typed = typed.slice(-20);
});

// Logo clicks
let logoClicks = 0;
function logoClick() {
  logoClicks++;
  if (logoClicks >= 5) { window.location.href = '/upload'; logoClicks = 0; }
}

// Show/hide password
function togglePw() {
  const inp = document.getElementById('passwordInput');
  const btn = document.getElementById('eyeBtn');
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙉'; }
  else { inp.type = 'password'; btn.textContent = '🙈'; }
}

// Login
document.getElementById('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  doLogin();
});

async function doLogin() {
  const raw  = document.getElementById('passwordInput').value;
  const btn  = document.querySelector('.login-btn');
  const err  = document.getElementById('errorMsg');
  btn.textContent = '💫 جاري الدخول...';
  btn.disabled = true;
  err.textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      cache: 'no-store',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: raw })
    });
    const d = await r.json();
    if (d.success) {
      btn.textContent = '💖 أهلًا بكِ في ذكرياتنا';
      window.location.replace('/gallery');
    } else {
      err.textContent = d.message;
      btn.textContent = 'افتحي ألبومنا 💕';
      btn.disabled = false;
      document.getElementById('passwordInput').value = '';
      document.getElementById('passwordInput').focus();
      document.querySelector('.login-card').style.animation = 'shake 0.4s ease';
      setTimeout(() => document.querySelector('.login-card').style.animation = '', 500);
    }
  } catch {
      err.textContent = 'تعذر فتح الألبوم الآن. جربي مرة أخرى.';
    btn.textContent = 'افتحي ألبومنا 💕';
    btn.disabled = false;
  }
}
// ── Birthday Surprise ────────────────────────────────────
const SPECIAL_DAYS = [
  { month: 8, day: 7, emoji: '🎂', title: 'يوم جميل وُلدت فيه أنتِ', sub: 'أتمنى لكِ عامًا يشبه قلبك: دافئًا، هادئًا، ومليئًا بالفرح.' },
  { month: 1, day: 1, emoji: '✨', title: 'عام جديد لنا', sub: 'أتمنى أن يحمل لنا أيامًا أكثر هدوءًا وذكريات أجمل.' },
];
(function checkSpecialDay() {
  const now   = new Date();
  const month = now.getMonth() + 1;
  const day   = now.getDate();
  const match = SPECIAL_DAYS.find(d => d.month === month && d.day === day);
  if (!match) return;

  // Confetti layer
  const cc = document.createElement('div');
  cc.className = 'bday-confetti';
  const confettiEmojis = ['🎉','💕','🌹','✨','🎊','🌸','💖','⭐','🎈'];
  for (let i = 0; i < 25; i++) {
    const s = document.createElement('span');
    s.textContent = confettiEmojis[i % confettiEmojis.length];
    const dur = 3 + Math.random() * 5;
    s.style.cssText = `left:${Math.random()*100}%;animation-duration:${dur}s;animation-delay:${Math.random()*4}s;font-size:${16+Math.random()*18}px;`;
    cc.appendChild(s);
  }
  document.body.appendChild(cc);

  // Main overlay
  const ov = document.createElement('div');
  ov.className = 'bday-overlay';
  ov.innerHTML = `
    <span class="bday-emoji">${match.emoji}</span>
    <div class="bday-title">${match.title}</div>
    <div class="bday-sub">${match.sub}</div>
    <div class="bday-hearts">💕 ❤️ 💕 ❤️ 💕</div>
    <button class="bday-close" onclick="this.closest('.bday-overlay').remove();document.querySelector('.bday-confetti').remove();">
      شكرًا لأنكِ هنا
    </button>
  `;
  document.body.appendChild(ov);
})();
</script>
</body>
</html>
