services:
  - type: web
    name: hana-youssef
    runtime: node
    # Render cannot resolve Replit's internal package-lock URLs.
    # Install from the public npm registry and ignore the imported lockfile.
    buildCommand: npm install --package-lock=false --registry=https://registry.npmjs.org
    startCommand: npm start
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: LOVE_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: hana_youssef
